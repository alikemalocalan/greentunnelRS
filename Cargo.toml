[package]
name = "greentunnelRS"
version = "0.1.0"
edition = "2021"
authors = ["Ali Kemal Öcalan <alikemalocalan@gmail.com>"]
description = "Lightweight anti-censorship DPI bypass proxy written in Rust for desktop, servers, and OpenWrt routers."

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
clap = { version = "4.6.6", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["json", "rustls-no-provider"], default-features = false }
rustls = { version = "0.23.43", features = ["ring", "std"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rand = "0.10.2"
anyhow = "1.0.104"
socket2 = "0.6.5"
