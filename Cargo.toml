[package]
name = "greentunnelRS"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Ali Kemal Öcalan <alikemalocalan@gmail.com>"]
description = "Ultra-fast, zero-dependency anti-censorship DPI bypass HTTP/HTTPS proxy written in Rust for OpenWrt routers, Linux, macOS, and Windows."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alikemalocalan/greentunnelRS"
keywords = ["anti-censorship", "dpi-bypass", "proxy", "doh", "openwrt"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "greentunnelRS"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }
tracing = { version = "0.1.44", features = ["std"], default-features = false }
fastrand = "2.3.0"
anyhow = "1.0.104"
socket2 = "0.6.5"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "warn"

[lints.clippy]
all = "warn"

