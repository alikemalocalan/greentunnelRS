[package]
name = "greentunnelRS"
version = "0.1.0"
edition = "2021"
authors = ["Ali Kemal Öcalan <alikemalocalan@gmail.com>"]
description = "Lightweight anti-censorship DPI bypass proxy written in Rust for desktop, servers, and OpenWrt routers."

[dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
clap = { version = "4.6.6", features = ["derive", "std", "help", "usage"], default-features = false }
rustls = { version = "0.23.43", features = ["ring", "std"], default-features = false }
tokio-rustls = { version = "0.26.4", features = ["ring"], default-features = false }
tracing = { version = "0.1.44", features = ["std"], default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"], default-features = false }
rand = "0.10.2"
anyhow = "1.0.104"
socket2 = "0.6.5"
webpki-roots = "1.0.9"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

