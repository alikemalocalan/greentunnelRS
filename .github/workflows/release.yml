name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.asset_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            gcc_pkg: gcc-aarch64-linux-gnu
            asset_name: greentunnelRS-openwrt-beryl-ax-aarch64
            toolchain: stable
            build_flags: ""
          - target: mipsel-unknown-linux-musl
            gcc_pkg: gcc-mipsel-linux-gnu
            asset_name: greentunnelRS-openwrt-mango-v2-mipsel
            toolchain: nightly
            build_flags: "-Z build-std=std,panic_abort"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (Stable for Tier 1/2)
        if: matrix.toolchain == 'stable'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust toolchain (Nightly for Tier 3 build-std)
        if: matrix.toolchain == 'nightly'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.gcc_pkg }} musl-tools

      - name: Build binary for ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_LINKER: mipsel-linux-gnu-gcc
        run: |
          cargo build --release --target ${{ matrix.target }} ${{ matrix.build_flags }}

      - name: Prepare release asset
        run: |
          cp target/${{ matrix.target }}/release/greentunnelRS ${{ matrix.asset_name }}
          tar -czvf ${{ matrix.asset_name }}.tar.gz ${{ matrix.asset_name }}

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
